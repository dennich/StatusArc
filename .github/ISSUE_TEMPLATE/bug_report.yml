name: Bug report
description: Report a reproducible StatusArc problem
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch StatusArc
        2. ...
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.x
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Mac hardware
      placeholder: e.g. Apple Silicon MacBook Pro
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: StatusArc version or commit
      placeholder: e.g. 1.0.0 or commit hash

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, SSIDs, private network details, and other secrets.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords and other sensitive information from this report.
          required: true
