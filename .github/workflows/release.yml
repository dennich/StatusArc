name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    env:
      PRODUCT_NAME: StatusArc

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v1.0.0"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build universal macOS app
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ROOT="$RUNNER_TEMP/statusarc-build"

          xcodebuild \
            -project StatusArc.xcodeproj \
            -target StatusArc \
            -configuration Release \
            -sdk macosx \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$BUILD_ROOT" \
            build

          APP_PATH="$BUILD_ROOT/Release/StatusArc.app"

          test -d "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/StatusArc"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify release metadata and architectures
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          BUNDLE_VERSION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$APP_PATH/Contents/Info.plist"
          )"

          BUILD_NUMBER="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$APP_PATH/Contents/Info.plist"
          )"

          if [[ "$BUNDLE_VERSION" != "$VERSION" ]]; then
            echo "Tag version $VERSION does not match app version $BUNDLE_VERSION"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid CFBundleVersion: $BUILD_NUMBER"
            exit 1
          fi

          BUILT_ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/StatusArc")"
          echo "Built architectures: $BUILT_ARCHS"

          for required_arch in arm64 x86_64; do
            if ! grep -qw "$required_arch" <<< "$BUILT_ARCHS"; then
              echo "Missing required architecture: $required_arch"
              exit 1
            fi
          done

      - name: Sign and notarize when Developer ID secrets are configured
        id: signing
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          HAVE_SIGNING=1

          for value in \
            "$APPLE_DEVELOPER_ID_P12_BASE64" \
            "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_SPECIFIC_PASSWORD"
          do
            if [[ -z "$value" ]]; then
              HAVE_SIGNING=0
            fi
          done

          xattr -cr "$APP_PATH"

          resign_sparkle_components() {
            local identity="$1"
            local framework="$APP_PATH/Contents/Frameworks/Sparkle.framework"
            local version_dir="$framework/Versions/B"

            if [[ ! -d "$version_dir" ]]; then
              echo "Expected Sparkle.framework/Versions/B was not embedded."
              exit 1
            fi

            local sign_args=(--force --options runtime --sign "$identity")

            if [[ "$identity" != "-" ]]; then
              sign_args+=(--timestamp)
            fi

            if [[ -d "$version_dir/XPCServices/Installer.xpc" ]]; then
              codesign "${sign_args[@]}" "$version_dir/XPCServices/Installer.xpc"
            fi

            if [[ -d "$version_dir/XPCServices/Downloader.xpc" ]]; then
              codesign \
                "${sign_args[@]}" \
                --preserve-metadata=entitlements \
                "$version_dir/XPCServices/Downloader.xpc"
            fi

            codesign "${sign_args[@]}" "$version_dir/Autoupdate"
            codesign "${sign_args[@]}" "$version_dir/Updater.app"
            codesign "${sign_args[@]}" "$framework"
          }

          if [[ "$HAVE_SIGNING" == "1" ]]; then
            echo "Using Developer ID signing and Apple notarization."

            CERT_PATH="$RUNNER_TEMP/developer-id.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/statusarc-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

            echo "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" \
              -k "$KEYCHAIN_PATH" \
              -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/security

            security set-key-partition-list \
              -S apple-tool:,apple: \
              -s \
              -k "$KEYCHAIN_PASSWORD" \
              "$KEYCHAIN_PATH"

            security list-keychains -d user -s "$KEYCHAIN_PATH"

            IDENTITY="$(
              security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
                | awk '/Developer ID Application/ {print $2; exit}'
            )"

            if [[ -z "$IDENTITY" ]]; then
              echo "No Developer ID Application identity found in the imported certificate."
              exit 1
            fi

            resign_sparkle_components "$IDENTITY"

            codesign \
              --force \
              --options runtime \
              --timestamp \
              --sign "$IDENTITY" \
              "$APP_PATH"

            codesign --verify --deep --strict --verbose=2 "$APP_PATH"

            NOTARY_ZIP="$RUNNER_TEMP/StatusArc-notary.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP"

            xcrun notarytool submit "$NOTARY_ZIP" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait

            xcrun stapler staple "$APP_PATH"
            xcrun stapler validate "$APP_PATH"

            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Developer ID/notarization secrets are incomplete."
            echo "::warning::Creating an ad-hoc signed build. macOS Gatekeeper may require manual approval on first launch."

            resign_sparkle_components "-"

            codesign --force --sign - "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"

            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package release
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/statusarc-release"
          mkdir -p "$RELEASE_DIR"

          ZIP_NAME="StatusArc-${VERSION}.zip"
          ZIP_PATH="$RELEASE_DIR/$ZIP_NAME"
          CHECKSUM_PATH="$RELEASE_DIR/$ZIP_NAME.sha256"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" | awk '{print $1}' > "$CHECKSUM_PATH"

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

          echo "Release SHA-256:"
          cat "$CHECKSUM_PATH"

      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          python3 - "$VERSION" "$NOTES_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          version, destination = sys.argv[1:3]
          text = Path("CHANGELOG.md").read_text()

          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(?P<body>.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)

          if match is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")

          Path(destination).write_text(match.group("body").strip() + "\n")
          PY

          if [[ "$SIGNED" == "true" ]]; then
            SECURITY_NOTE="Developer ID signed and notarized."
          else
            SECURITY_NOTE="Ad-hoc signed development distribution. macOS may require manual approval on first launch."
          fi

          {
            printf '\n---\n\n'
            printf '%s\n' "$SECURITY_NOTE"
          } >> "$NOTES_FILE"

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "$ZIP_PATH" \
            "$CHECKSUM_PATH" \
            --draft \
            --verify-tag \
            --title "StatusArc ${VERSION}" \
            --notes-file "$NOTES_FILE"
